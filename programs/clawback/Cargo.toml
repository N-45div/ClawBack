[package]
name = "clawback"
version = "0.1.0"
description = "Clawback: round-up savings + a fair claw game on MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "clawback"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
# 0.18 supports both ER validator versions; 0.20's #[vrf] macro does not compile.
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
